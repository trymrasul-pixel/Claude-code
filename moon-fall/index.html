<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "EB Garamond"; font-style: normal; font-weight: 400; src: url(node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-style: normal; font-weight: 500; src: url(node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-style: italic; font-weight: 400; src: url(node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-style: italic; font-weight: 500; src: url(node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-500-italic.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; src: url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format("woff2"); }
  body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
  const faces = ['400 20px "EB Garamond"', '500 20px "EB Garamond"', 'italic 400 20px "EB Garamond"', 'italic 500 20px "EB Garamond"', '500 20px Inter', '600 20px Inter'];
  await Promise.all(faces.map(f => document.fonts.load(f)));
  try { await import('./src/main.js'); } catch (e) { window.ERR = String(e.stack || e); }
</script>
</body>
</html>
